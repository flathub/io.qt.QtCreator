name: krb5
buildsystem: autotools
subdir: src
config-opts:
  - --disable-static
  - --disable-rpath
  - --without-libedit
  - --without-readline
  - --without-system-verto
cleanup:
  - /bin
  - /sbin
  - /share/doc
  - /share/examples
  - /share/man
  - /include
  - /lib/pkgconfig
sources:
  - type: archive
    url: https://github.com/krb5/krb5/archive/refs/tags/krb5-1.22.2-final.tar.gz
    sha256: 289f5bb81d1f2f8d5eecebe56a056aeed95d35fd9bb4a7071c5dd7ad4b3fe888
    x-checker-data:
      type: anitya
      project-id: 13287
      url-template: https://github.com/krb5/krb5/archive/refs/tags/krb5-$version.tar.gz
      stable-only: true
  - type: shell
    commands:
      - cd src && autoconf && autoheader
